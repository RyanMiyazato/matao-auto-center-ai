services:

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      - postgres
      - ollama
    networks:
      - ai-network

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ai-network

  postgres:
    image: postgres:17
    container_name: postgres-ai
    environment:
  	POSTGRES_USER: ${POSTGRES_USER}
  	POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  	POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-network

volumes:
  n8n_data:
  ollama_data:
  postgres_data:

networks:
  ai-network: